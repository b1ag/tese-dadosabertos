  <nav aria-label="Principal"><a href="#inicio" data-v="inicio">Início</a><a href="#reunioes" data-v="reunioes">Reuniões</a><a href="#calendario" data-v="calendario">Calendário</a><a href="#rsl" data-v="rsl">Revisão sistemática</a><a href="#lacunas" data-v="lacunas">Lacunas</a></nav>
  <button class="btn" id="lock">Modo editor</button><button class="btn" id="theme" aria-label="Alternar tema claro e escuro">Tema</button>
</div></header>

<script>
const $=s=>document.querySelector(s),app=$('#app'),D={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';
const fmtL=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'';
const cut=(s,n)=>s.length>n?s.slice(0,n).trimEnd()+'…':s;
/*LOAD*/
async function load(k,f){if(!D[k]){const r=await fetch(f);if(!r.ok)throw new Error('Não foi possível ler o arquivo '+f+'. Confira se ele está no repositório, na mesma pasta do index.html, e se você abriu o endereço do GitHub Pages (veja o README).');D[k]=await r.json()}return D[k]}
/*END*/
const SL={incluido:['Incluído','b-ok'],excluido:['Excluído','b-no'],analise:['Em análise','b-wip']};
const sk=s=>{const n=norm(s);return n.includes('inclu')?'incluido':n.includes('exclu')?'excluido':'analise'};
const LS={identificada:['Identificada','b-id'],exploracao:['Em exploração','b-wip'],questao:['Virou questão de pesquisa','b-ok'],descartada:['Descartada','b-no']};
const lk=s=>{const n=norm(s);return n.includes('explor')?'exploracao':n.includes('quest')?'questao':n.includes('descart')?'descartada':'identificada'};
const bd=(M,k)=>`<span class="badge ${M[k][1]}">${M[k][0]}</span>`;

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dd=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);

const DOW=['dom','seg','ter','qua','qui','sex','sáb'],TL={reuniao:'Reunião',prazo:'Prazo',marco:'Marco',evento:'Evento'};

async function calendario(){

    ind=dn?'concluído':L?'atrasada há '+m+(m>1?' dias':' dia'):n===0?'vence hoje':n===1?'vence amanhã':'faltam '+n+' dias';

  const chip=x=>`<b class="ch k-${x.tipo}${isLate(x)?' k-late':''}" title="${esc(x.titulo)}">${esc(x.tipo==='reuniao'?'Reunião':x.titulo)}</b>`;
  app.innerHTML=`<div class="head"><h1>Calendário e cronograma</h1><p class="meta" style="max-width:62ch">Reuniões de orientação, prazos e marcos da pesquisa. Clique em um dia para ver os detalhes.</p><div class="acts"><button class="btn pri" data-act="prazo">Novo prazo ou evento</button><button class="btn" data-act="site">Editar próxima reunião</button></div></div>

const GH=(p,tk,o={})=>fetch('https://api.github.com/repos/'+repoOf()+p,{...o,headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'}});
function setOwner(on){D.edit=on;document.body.classList.toggle('owner',on);lock.textContent=on?'Editor ativo · Sair':'Modo editor'}
async function verify(tk){try{const r=await GH('',tk);if(r.status===401||r.status===403){try{localStorage.removeItem('ghtoken')}catch(e){}return false}const j=await r.json();return r.ok&&!!j.permissions?.push}catch(e){return false}}
const dl=f=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json(f)],{type:'application/json'}));a.download=f;a.click()};
let tt;function toast(m,o={}){const t=$('#toast');t.innerHTML=esc(m)+(o.file?' <button class="btn sm" id="tdl">Baixar arquivo</button>':'');t.className='show'+(o.err?' err2':'');if(o.file)$('#tdl').onclick=()=>dl(o.file);clearTimeout(tt);tt=setTimeout(()=>t.className='',o.err?12000:6000)}
async function save(f){
  if(D.s.modoDemo)return 'demo';
  const tk=tok(),repo=repoOf();
  if(!tk||!repo)throw new Error('Token ou repositório não configurado. Entre novamente no Modo editor.');
  const readError=async r=>{let j={};try{j=await r.json()}catch(e){}return j.message||('HTTP '+r.status)};
  // Consulta os metadados para usar a branch padrão real do repositório.
  let r=await GH('',tk);
  if(!r.ok)throw new Error('Erro ao acessar o repositório: '+await readError(r));
  const meta=await r.json();
  const branch=D.s.branch||meta.default_branch;
  if(!branch)throw new Error('Não foi possível identificar a branch padrão do repositório.');
  // Recupera o SHA atual, necessário para atualizar um arquivo existente.
  r=await GH('/contents/'+encodeURIComponent(f)+'?ref='+encodeURIComponent(branch),tk);
  if(!r.ok)throw new Error('Erro ao localizar '+f+' na branch '+branch+': '+await readError(r));
  const file=await r.json();
  if(!file.sha)throw new Error('O GitHub não retornou o identificador SHA de '+f+'.');
  r=await GH('/contents/'+encodeURIComponent(f),tk,{
    method:'PUT',
    body:JSON.stringify({
      message:'Atualização pelo site: '+f,
      branch,
      sha:file.sha,
      content:btoa(unescape(encodeURIComponent(json(f))))
    })
  });
  if(!r.ok)throw new Error('Falha ao salvar '+f+': '+await readError(r));
  return 'saved';
}

async function openForm(kind,k){if(!D.edit)return;await load4();const c=F[kind],old=kind==='site'?D.s:(k?LST[kind]().find(x=>x.k===k):null);let arm=false;
  dlg.innerHTML=`<form id="fm"><h2>${old?c.e:c.t}</h2>${c.html()}<div class="row">${old&&kind!=='site'?'<button type="button" class="btn" id="rm" style="margin-right:auto">Excluir</button>':''}<button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri">${old?'Salvar alterações':'Salvar'}</button></div></form>`;
  dlg.showModal();$('#cx').onclick=()=>dlg.close();const fm=$('#fm');
  if(old)for(const [n,v] of Object.entries(FILL[kind](old))){const el=fm.elements[n];if(!el)continue;if(el.type==='checkbox')el.checked=!!v;else el.value=v??''}
  c.init&&c.init(old);
  if(old&&kind!=='site')$('#rm').onclick=e=>{if(!arm){arm=true;e.target.textContent='Confirmar exclusão';return}const l=LST[kind]();l.splice(l.indexOf(old),1);dlg.close();route();persist(kind)};
  fm.onsubmit=e=>{e.preventDefault();const en=c.build(new FormData(fm));
    if(kind==='site'){Object.assign(D.s,en);$('#brand').textContent=D.s.nomeBlog||'Tese de doutorado'}else if(old)Object.assign(old,en);else LST[kind]().unshift(en);
    dlg.close();route();persist(kind)};
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'),d=e.target.closest('[data-edit]'),n=e.target.closest('[data-done]');
  if(a)openForm(a.dataset.act);else if(d)openForm(d.dataset.edit,d.dataset.k);
  else if(n&&D.edit){const x=D.c.find(y=>y.k===n.dataset.done);if(x){x.concluido=!x.concluido;route();persist('prazo')}}});
lock.onclick=()=>{
  if(D.edit){setOwner(false);try{localStorage.removeItem('ghtoken')}catch(e){}route();return}
  const demo=D.s?.modoDemo,ok=demo||repoOf();
  dlg.innerHTML=`<h2>Modo editor</h2><p>Só quem tem permissão de escrita no repositório da pesquisa consegue ativar. Para os demais visitantes, os botões de cadastro e edição ficam ocultos.</p>
  ${demo?'<p class="meta">Prévia de demonstração: entra sem token e as alterações valem só nesta visita.</p>':ok?'<label for="tk0">Token do GitHub <small>(fica só neste navegador)</small></label><input type="password" id="tk0" placeholder="github_pat_..." autocomplete="off">':'<p class="meta">Não foi possível descobrir o repositório. Preencha o campo repo em site.json (usuario/repositorio).</p>'}
  <p class="meta" id="msg" role="status"></p><div class="row"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri" id="go" ${ok?'':'disabled'}>Entrar</button></div>`;
  dlg.showModal();$('#cx').onclick=()=>dlg.close();
  $('#go').onclick=async()=>{if(demo){setOwner(true);dlg.close();return}
    const t=$('#tk0').value.trim();if(!t){$('#msg').textContent='Cole o token para entrar.';return}
    $('#msg').textContent='Verificando permissão...';
    if(await verify(t)){try{localStorage.setItem('ghtoken',t)}catch(e){}setOwner(true);dlg.close()}
    else $('#msg').textContent='Token inválido ou sem permissão de escrita neste repositório.'}};

const V={inicio,reunioes,calendario,rsl,lacunas};
async function route(){
  const h=location.hash.slice(1),pm=/^(reuniao|lacuna)-(.+)$/.exec(h),v=V[h]?h:pm?(pm[1]==='reuniao'?'reunioes':'lacunas'):'inicio';
  document.querySelectorAll('nav a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  try{await load4();keys();pm?post(pm[1],pm[2]):await V[v]()}catch(e){app.innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
(async()=>{
  try{const s=await load('s','site.json');$('#brand').textContent=s.nomeBlog;document.title=s.nomeBlog+' | '+s.doutoranda;$('#foot').textContent='© '+new Date().getFullYear()+' '+s.doutoranda}catch(e){}
  let t;try{t=localStorage.getItem('tema')}catch(e){}
  const set=d=>document.documentElement.classList.toggle('dark',d);set(t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches);
  $('#theme').onclick=()=>{const d=!document.documentElement.classList.contains('dark');set(d);try{localStorage.setItem('tema',d?'dark':'light')}catch(e){}};
  addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
  if(tok()&&repoOf()&&await verify(tok()))setOwner(true);
})();
